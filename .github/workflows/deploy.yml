name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    name: Validate HTML and referenced files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate index.html and referenced files
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(".")
          html = (root / "index.html").read_text(encoding="utf-8")
          assert html.lstrip().startswith("<!DOCTYPE html>"), "index.html must start with <!DOCTYPE html>"
          assert html.rstrip().endswith("</html>"), "index.html must end with </html>"

          missing = []
          for src in re.findall(r'(?:src|href)="([^"#]+)"', html):
              if src.startswith(("http://", "https://", "mailto:", "data:")):
                  continue
              if not (root / src).exists():
                  missing.append(src)
          if missing:
              print("Missing files:", missing)
              sys.exit(1)
          print("HTML and referenced files validated")
          PY

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
